<!-- Brand & Mascot Delight Header -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="relative flex items-center justify-center w-24 h-24 mb-space-sm">
<div class="absolute inset-0 bg-primary/10 rounded-full scale-110 animate-pulse"></div>
<div class="relative w-20 h-20 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center p-2">
<img alt="NutriCasa Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuANh2M9im8NR4mwwI8UtNqivXnePQ4DNzQA_bz4kw4_IQFyg0tmMFSH_B11676ZnIYh_ZyhDzlREOFWJBlG0rvv7DwvCAfUNlomCCFDvN8rm1LSR24_hgbkGC3ptliVWjhfXQCpIzxrunUMOQrn3gL---tJpKONDxVK7yTPB36mHsv25ksdmkfFHwAofO1n0Kp1631YmOCpMqaVZpMOZmSRZoUsx1Bh7rX5-nGsNbVWmGcSo_5NWfiE"/>
</div>
<div class="absolute -bottom-1 -right-1 bg-secondary-container text-on-secondary w-7 h-7 rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[16px]">skillet</span>
</div>
</div>
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-fixed/50 text-on-primary-fixed text-label-sm font-label-sm mb-space-xs">
<span class="material-symbols-outlined text-[14px]">eco</span>
<span>Cozinha Inteligente &amp; Afetuosa</span>
</div>
<h1 class="text-headline-xl-mobile font-headline-xl-mobile text-on-surface tracking-tight">
      NutriCasa
    </h1>
<p class="text-headline-sm font-headline-sm text-primary mt-0.5">
      Cozinhe com o que você já tem
    </p>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[280px] mt-1.5 leading-relaxed">
      Economize, evite desperdício e coma bem todos os dias.
    </p>
</div>
<!-- Interactive Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-md">
<!-- Tab Pill Switcher (Visual Delight) -->
<div class="grid grid-cols-2 p-1 bg-surface-container-low rounded-lg mb-space-md">
<button class="py-2 rounded-md bg-surface-container-lowest text-primary text-label-md font-label-md shadow-sm flex items-center justify-center gap-1.5 transition-all" id="tab-login" type="button">
<span class="material-symbols-outlined text-[16px]">login</span>
<span>Entrar</span>
</button>
<button class="py-2 rounded-md text-on-surface-variant text-label-md font-label-md flex items-center justify-center gap-1.5 transition-all hover:text-on-surface" id="tab-signup" type="button">
<span class="material-symbols-outlined text-[16px]">person_add</span>
<span>Cadastrar</span>
</button>
</div>
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<!-- E-mail Input Group -->
<div class="flex flex-col gap-1.5">
<label class="text-label-md font-label-md text-on-surface flex items-center justify-between" for="email">
<span>E-mail</span>
<span class="text-label-sm font-label-sm text-outline">Obrigatório</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            mail
          </span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline/70 focus:outline-none focus:bg-surface-container transition-colors" id="email" placeholder="seu@email.com" required="" type="email"/>
</div>
</div>
<!-- Senha Input Group -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="text-label-md font-label-md text-on-surface" for="password">
            Senha
          </label>
<button class="text-label-sm font-label-sm text-secondary hover:text-on-secondary-container transition-colors" id="forgot-btn" type="button">
            Esqueceu a senha?
          </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">
            lock
          </span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-low rounded-lg text-body-md font-body-md text-on-surface placeholder:text-outline/70 focus:outline-none focus:bg-surface-container transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-3 text-outline hover:text-on-surface p-1 flex items-center justify-center transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-13 py-3.5 px-space-md rounded-full bg-primary-container text-on-primary text-label-lg font-label-lg shadow-md hover:bg-primary active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-1" id="submit-btn" type="submit">
<span>Entrar no NutriCasa</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Warm Motivation Micro-Banner -->
<div class="mt-space-md p-2.5 rounded-lg bg-surface-container-low flex items-center gap-2.5">
<div class="w-7 h-7 rounded-full bg-secondary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary text-[16px]">savings</span>
</div>
<p class="text-label-sm font-label-sm text-on-surface-variant">
        Famílias no NutriCasa economizam até <strong class="text-on-surface font-label-md">R$ 280/mês</strong> aproveitando a despensa.
      </p>
</div>
</div>
<!-- Social Divider -->
<div class="relative flex items-center justify-center my-space-xs">
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface text-label-sm font-label-sm text-outline uppercase tracking-wider">
      ou continue com
    </span>
</div>
<!-- Social Action Buttons -->
<div class="grid grid-cols-2 gap-space-sm mt-space-sm">
<!-- Google Login -->
<button class="h-12 px-3 rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-center gap-2 text-label-md font-label-md text-on-surface hover:bg-surface-container-low active:scale-95 transition-all" type="button">
<svg class="w-4 h-4 shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.9c2.28-2.1 3.645-5.19 3.645-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.9-3.05c-1.08.72-2.45 1.16-4.03 1.16-3.1 0-5.74-2.1-6.68-4.92H1.21v3.15C3.25 21.4 7.31 24 12 24z" fill="#34A853"></path>
<path d="M5.32 14.28a7.14 7.14 0 0 1 0-4.56V6.57H1.21A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.21 5.43l4.11-3.15z" fill="#FBBC05"></path>
<path d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.6 1.21 6.57l4.11 3.15c.94-2.82 3.58-4.95 6.68-4.95z" fill="#EA4335"></path>
</svg>
<span>Google</span>
</button>
<!-- Apple Login -->
<button class="h-12 px-3 rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-center gap-2 text-label-md font-label-md text-on-surface hover:bg-surface-container-low active:scale-95 transition-all" type="button">
<svg class="w-4 h-4 shrink-0 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.99.6-2.64 1.35-.57.65-1.07 1.72-.94 2.73 1 .08 2.03-.49 2.65-1.23"></path>
</svg>
<span>Apple</span>
</button>
</div>
<!-- Bottom Signup Prompt -->
<div class="mt-space-lg text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
      Não tem uma conta?
      <button class="font-headline-sm text-headline-sm text-primary hover:text-primary-container transition-colors ml-1 underline decoration-primary/40 underline-offset-4" id="link-create" type="button">
        Criar conta
      </button>
</p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const submitBtn = document.getElementById('submit-btn');
    const linkCreate = document.getElementById('link-create');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    function setMode(isLogin) {
      if (isLogin) {
        tabLogin.className = 'py-2 rounded-md bg-surface-container-lowest text-primary text-label-md font-label-md shadow-sm flex items-center justify-center gap-1.5 transition-all';
        tabSignup.className = 'py-2 rounded-md text-on-surface-variant text-label-md font-label-md flex items-center justify-center gap-1.5 transition-all hover:text-on-surface';
        submitBtn.innerHTML = '<span>Entrar no NutriCasa</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      } else {
        tabSignup.className = 'py-2 rounded-md bg-surface-container-lowest text-primary text-label-md font-label-md shadow-sm flex items-center justify-center gap-1.5 transition-all';
        tabLogin.className = 'py-2 rounded-md text-on-surface-variant text-label-md font-label-md flex items-center justify-center gap-1.5 transition-all hover:text-on-surface';
        submitBtn.innerHTML = '<span>Começar Gratuitamente</span><span class="material-symbols-outlined text-[18px]">sparkles</span>';
      }
    }

    if (tabLogin && tabSignup) {
      tabLogin.addEventListener('click', () => setMode(true));
      tabSignup.addEventListener('click', () => setMode(false));
    }

    if (linkCreate) {
      linkCreate.addEventListener('click', () => setMode(false));
    }
  })();
</script></main></body></html>
