name: nutricasa
description: "NutriCasa - cozinhe com o que você já tem."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.2.1
  sentry_flutter: ^9.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  timezone: ^0.11.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/taco.json
    - assets/logo.png
    - assets/fotos/
    - assets/privacidade.md

# Gerar ícone e abertura (rodar após trocar o logo):
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icone.png
  adaptive_icon_background: "#FAFAF7"
  adaptive_icon_foreground: assets/logo.png
  adaptive_icon_foreground_inset: 24

flutter_native_splash:
  color: "#FAFAF7"
  color_dark: "#121614"
  image: assets/logo.png
  android_12:
    color: "#FAFAF7"
    color_dark: "#121614"
    # Android 12+ corta o ícone num círculo: esta versão tem margem para caber.
    image: assets/splash_android12.png

# ponytail: flutter_local_notifications_linux pede dbus 0.7 e wakelock_plus pede 0.8;
# o app só roda em Android/iOS, então o lado Linux não importa. Tirar quando alinharem.
dependency_overrides:
  dbus: ^0.8.0
